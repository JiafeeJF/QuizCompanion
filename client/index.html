<!doctype html>
<html lang="zh-CN">
  <head>
    <script>
      (() => {
        const ua = navigator.userAgent || '';
        const isAndroidOrHarmony = /Android|HarmonyOS|OpenHarmony|ArkWeb/i.test(ua);
        const isNativeShell =
          location.hostname === 'localhost' ||
          location.hostname === '127.0.0.1' ||
          location.protocol === 'capacitor:' ||
          location.protocol === 'ionic:';
        const isMobileAdminPath = /^\/m\/[A-Za-z0-9_-]{24,128}\/?$/.test(location.pathname);
        if (isAndroidOrHarmony && !isNativeShell && !isMobileAdminPath) {
          location.replace('https://download.wakaibg5.top');
        }
      })();
    </script>
